<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click-YO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>Ω</text></svg>"
    />
  </head>
  <body class="bg-slate-000">
    <div
      id="notificacion-logro"
      class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden animate-bounce"
    >
      <div
        class="bg-white border-2 border-blue-500 shadow-2xl rounded-2xl px-6 py-3 flex items-center gap-3"
      >
        <span id="logro-emoji" class="text-3xl"></span>
        <div>
          <p class="text-[10px] font-black uppercase text-blue-500">Sistema</p>
          <p id="logro-texto" class="font-bold text-slate-700"></p>
        </div>
      </div>
    </div>

    <div id="app" class="max-w-md mx-auto p-4 min-h-screen flex flex-col">
      <header class="py-4 text-center border-b mb-4">
        <h1 class="text-2xl font-bold text-blue-700">Click YO</h1>
        <div
          id="status-bar"
          class="text-[10px] font-bold uppercase text-black mt-1 tracking-widest"
        >
          Panel de Control - Profesor
        </div>
        <div id="profesor-info" class="mt-2 text-xs text-slate-500">
          <!-- Aquí se mostrará la información del profesor -->
        </div>
      </header>

      <div
        id="section-login"
        class="mt-20 flex-1 flex flex-col justify-center items-center"
      >
        <div
          class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 w-full text-center"
        >
          <button
            onclick="login()"
            class="w-full bg-white border border-slate-300 flex items-center justify-center gap-3 py-3 rounded-xl shadow-sm"
          >
            <span class="font-semibold text-slate-700"
              >Entrar con Google (Profesor)</span
            >
          </button>
        </div>
      </div>

      <div id="section-profesor" class="hidden">
        <!-- Crear horario -->
        <!-- CONTENEDOR MAESTRO DEL ACORDEÓN -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 mb-2">
          <!-- Cabecera con el Triángulo (Visible siempre) -->
          <div
            class="flex justify-between items-center p-3 cursor-pointer hover:bg-slate-700 rounded-t-xl"
            onclick="
              togglePanel('gestion-clases-body', 'triangulo-clases-icon')
            "
          >
            <h3 class="text-white text-[10px] uppercase font-bold opacity-90">
              Gestión de Clases y Horarios
            </h3>
            <span
              id="triangulo-clases-icon"
              class="text-white text-xs transition-transform duration-300 transform rotate-180"
            >
              ▲
            </span>
          </div>

          <!-- CUERPO DEL ACORDEÓN (Inicia cerrado con 'hidden') -->
          <div
            id="gestion-clases-body"
            class="hidden p-4 space-y-4 border-t border-slate-700"
          >
            <!-- Parte 1: Crear Clase -->
            <div class="flex gap-2">
              <select
                id="crear-horario"
                class="bg-orange-500 text-black border border-slate-700 px-3 py-2 rounded-lg text-sm"
              >
                <option value="">Horario</option>
                <option>SA</option>
                <option>A</option>
                <option>SB</option>
                <option>B</option>
                <option>SC</option>
                <option>C</option>
                <option>SD</option>
                <option>D</option>
              </select>

              <input
                id="crear-materia"
                placeholder="Nombre de la materia"
                class="bg-slate-900 text-white placeholder-slate-400 border border-slate-700 px-3 py-2 rounded-lg flex-1 text-sm"
              />

              <button
                onclick="crearClase()"
                class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg text-xs text-white font-bold"
              >
                Crear clase
              </button>
            </div>

            <!-- Parte 2: Lista de Clases -->
            <div>
              <h2
                class="text-[10px] uppercase font-bold opacity-90 text-white mb-2"
              >
                Mis clases:
              </h2>
              <div
                id="lista-clases"
                class="flex flex-col divide-y divide-slate-700 text-[12px] font-bold opacity-70 text-white"
              >
                <!-- Contenido dinámico -->
              </div>
            </div>
          </div>
          <!-- Cierre del body -->
        </div>

        <!-- Fin agregado -->

        <!-- Sistema de Evaluación -->
        <div
          class="bg-slate-800 rounded-xl border border-slate-700 mb-2 overflow-hidden"
        >
          <!-- Cabecera (Siempre visible) -->
          <div
            class="flex justify-between items-center cursor-pointer p-3"
            onclick="togglePanel('sistema-evaluacion-body', 'triangulo-icon')"
          >
            <h3 class="text-white text-[10px] uppercase font-bold opacity-90">
              Sistema de Evaluación de la comunidad
            </h3>

            <!-- El triángulo que rota -->
            <!-- 1. Añadimos rotate-180 aquí -->
            <span
              id="triangulo-icon"
              class="text-white text-xs transition-transform duration-300 transform rotate-180"
            >
              ▲
            </span>
          </div>
          <!-- CUERPO DEL ACORDEÓN (Ahora envuelve todo) -->
          <!-- 2. Añadimos hidden aquí para que empiece cerrado -->
          <div
            id="sistema-evaluacion-body"
            class="hidden transition-all duration-300 p-4 pt-0 border-t border-slate-700"
          >
            <select
              id="prof-equipo-expo"
              class="w-full p-1 rounded-lg border-2 border-orange-300 mb-2 font-bold text-sm"
            >
              <option value="">-- Seleccionar Equipo Expositor --</option>
            </select>
            <div class="grid grid-cols-2 gap-2">
              <button
                onclick="iniciarVotacion()"
                class="bg-orange-600 text-white py-2 rounded-lg font-bold text-[9px] uppercase"
              >
                Activar Votación
              </button>
              <button
                onclick="terminarVotacion()"
                class="bg-green-600 text-white py-2 rounded-lg font-bold text-[9px] uppercase"
              >
                Cerrar Votación
              </button>
            </div>
            <div
              id="stats-votacion"
              class="mt-4 hidden bg-white p-3 rounded-xl border border-orange-200 shadow-sm"
            >
              <div class="flex justify-between items-center border-b pb-2 mb-2">
                <span class="font-black text-orange-700 text-[10px]"
                  >PROMEDIO GRAL:</span
                >
                <p class="text-[9px] text-slate-400 font-bold uppercase">
                  <span id="votos-contados">0</span> votos recibidos
                </p>
                <span id="avg-total" class="text-xl font-black text-orange-600"
                  >0.0</span
                >
              </div>
              <div
                id="desglose-criterios"
                class="space-y-1 text-[9px] font-bold text-slate-500 uppercase"
              ></div>
            </div>
            <div class="grid grid-cols-2 gap-2 mt-2">
              <button
                onclick="resetVotacionActual()"
                class="bg-red-100 text-red-600 py-2 rounded-lg font-bold text-[9px] uppercase border border-red-200"
              >
                Reset votos Equipo Actual
              </button>
              <button
                onclick="exportarMedallasCSV()"
                class="bg-blue-600 text-white py-2 rounded-lg font-bold text-[9px] uppercase"
              >
                Descargar Datos de Participacion
              </button>
            </div>

            <button
              onclick="resetTodasVotaciones()"
              class="w-full mt-2 bg-red-600 text-white py-2 rounded-lg font-bold text-[9px] uppercase"
            >
              Reset Votos Todo el Horario
            </button>

            <button
              onclick="exportarVotacionesCSV()"
              class="w-full mt-2 bg-green-600 text-white py-2 rounded-lg font-bold text-[9px] uppercase"
            >
              Exportar Votos CSV
            </button>
            <!--
          <button
            onclick="reiniciarMedallasPorGrupo()"
            class="w-full py-3 bg-yellow-50 text-yellow-700 rounded-xl text-[10px] font-black uppercase border border-yellow-200 mb-2"
          >
            🏅 Reiniciar Medallas del Grupo
          </button>
          -->
            <button
              onclick="verAlumnosPendientes()"
              class="w-full mt-2 bg-blue-100 text-blue-700 py-2 rounded-lg font-bold text-[9px] uppercase border border-blue-200"
            >
              🔍 Ver quién falta por votar
            </button>
          </div>
        </div>
        <!--fin acordeon-->

        <!-- Filtro de horario -->
        <div class="bg-blue-900 p-3 rounded-xl text-white mb-1">
          <label class="text-[10px] uppercase font-bold opacity-90"
            >Horario Seleccionado:</label
          >
          <select
            id="filtro-horario"
            onchange="actualizarTodoProfesor()"
            class="w-full bg-blue-500 p-2 rounded-lg text-[12px] font-bold opacity-70 outline-none border-none mt-1"
          >
            <option value="">Seleccionar clase</option>
          </select>

          <!-- Input para nuevo grupo -->

          <!-- CONTENEDOR MAESTRO DE GRUPOS -->
          <div
            class="mt-2 bg-slate-800 rounded-xl border border-slate-700 overflow-hidden"
          >
            <!-- Cabecera del Acordeón (Visible siempre) -->
            <div
              class="flex justify-between items-center p-3 cursor-pointer hover:bg-slate-700 bg-slate-900"
              onclick="
                togglePanel('gestion-grupos-body', 'triangulo-grupos-icon')
              "
            >
              <h3 class="text-white text-[10px] uppercase font-bold opacity-90">
                Gestión de Grupos
              </h3>
              <span
                id="triangulo-grupos-icon"
                class="text-white text-xs transition-transform duration-300 transform rotate-180"
              >
                ▲
              </span>
            </div>

            <!-- CUERPO DEL ACORDEÓN (Inicia cerrado) -->
            <div
              id="gestion-grupos-body"
              class="hidden p-4 bg-slate-800 border-t border-slate-700"
            >
              <!-- Parte 1: Input de creación -->
              <div class="mb-4">
                <label class="block text-white text-xs font-bold mb-2"
                  >Crear nuevo grupo:</label
                >
                <div class="flex gap-2 items-center">
                  <input
                    type="text"
                    id="nuevoGrupo"
                    placeholder="Nombre del grupo"
                    class="flex-1 bg-yellow-100 border p-1 rounded-md text-sm text-black outline-none"
                  />
                  <button
                    onclick="crearGrupo()"
                    class="bg-green-600 text-white px-3 py-1 rounded-md hover:bg-green-700 text-xs font-bold"
                  >
                    Crear
                  </button>
                </div>
              </div>

              <!-- Parte 2: Lista dinámica -->
              <div id="lista-grupos" class="space-y-1">
                <!-- Los grupos se cargarán aquí dinámicamente -->
              </div>
            </div>
            <!-- Cierre del body -->
          </div>
        </div>
        <!--fin input nuevo grupo-->

        <!-- Línea divisoria -->
        <hr class="border-t border-gray-300 my-4" />

        <div class="mb-1">
          <button
            onclick="limpiarCola()"
            class="w-full mt-2 bg-orange-600 py-2 rounded-lg font-bold text-white text-[10px] uppercase"
          >
            Vaciar Cola de participacion
          </button>
        </div>

        <!--Boton cola abierta cerrada-->
        <div class="grid grid-cols-2 gap-2 mb-6">
          <button
            id="btn-master-switch"
            onclick="toggleParticipacion()"
            class="py-4 rounded-xl font-black text-gray-300 text-[10px] uppercase bg-gray-200 border-2 border-gray-300"
          >
            participacion
          </button>

          <!--Boton registro abierto cerrado -->
          <button
            id="btn-lock-registro"
            onclick="toggleRegistroBloqueado()"
            class="py-4 rounded-xl font-black text-gray-300 text-[10px] uppercase bg-gray-200 border-2 border-gray-300"
          >
            Registro
          </button>
        </div>

        <div class="space-y-2 mb-8" id="lista-cola"></div>

        <div class="flex justify-between items-center mb-2 px-1">
          <h3
            class="font-bold text-slate-500 text-[10px] uppercase tracking-widest"
          >
            Alumnos Registrados
          </h3>
          <span
            class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-[9px] font-black"
            >TOTAL: <span id="total-registrados">0</span></span
          >
        </div>

        <div
          class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6"
        >
          <div id="tabla-notas" class="max-h-96 overflow-y-auto"></div>
        </div>
      </div>
      <!-- FOOTER -->
      <footer class="mt-8 pb-4 border-t border-slate-200 pt-4 text-center">
        <p
          class="text-[10px] text-slate-400 font-medium tracking-widest uppercase"
        >
        <a
            href="https://github.com/orhurtado/click-yo"
            target="_blank"
            rel="noopener noreferrer"
            class="text-blue-900 font-bold "
          >
          'CLICK-YO'
          </a> BY
          <span class="font-bold text-slate-500">OHM</span>
          <a
            href="https://opensource.org/license/mit"
            target="_blank"
            rel="noopener noreferrer"
            class="hover:text-blue-900 transition-colors"
          >
            (MIT License)
          </a>
          2026
          <br />
          V.3.0 Rev.0
        </p>
      </footer>
    </div>

    <!--
// Código JavaScript 
-->

    <script type="module">
      window.claseActiva = null;

      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        updateDoc,
        deleteDoc,
        collection,
        query,
        where,
        orderBy,
        onSnapshot,
        getDocs,
        writeBatch,
        increment,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

	//CONFIGURACION PARA FIREBASE
      const firebaseConfig = {
        apiKey: "xxxxxxxxxxxx",
        authDomain: "xxxxxxxxxxx",
        projectId: "xxxxxxxxxxx",
        storageBucket: "xxxx",
        messagingSenderId: "xxxx",
        appId: "xxx",
        measurementId: "xxx",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();
      const sonidoNotificacion = new Audio("notificacion.mp3");

      const RUBRICA = [
        {
          id: "dominio",
          label:
            "QUÉ TANTO DOMINIO TENIAN DEL TEMA? (1:NINGUNO .. 5:TOTALMENTE)",
        },
        {
          id: "org",
          label:
            "QUÉ TAN BIEN ORGANIZARON LA EXPOSICION? (1:DEFICIENTE .. 5:EXCELENTE)",
        },
        {
          id: "calidad",
          label: "QUÉ TAN BIEN RESPONDIERON LAS PREGUNTAS? (1:MAL .. 5:BIEN)",
        },
        {
          id: "comunicacion",
          label: "QUÉ TAN BIEN ENTENDISTE EL TEMA? (1:NADA .. 5:TOTALMENTE)",
        },
        {
          id: "tiempo",
          label:
            "SÍ UN EJERCICIO DE ESTE TEMA ENTRARA EN EL EXAMEN PODRIAS REALIZARLO? (1:NO..5:TOTALMENTE)",
        },
      ];
      //actualizado
      const RANKS = {
        limon: { pts: 1, key: "medallas.limon" },
        bronce: { pts: 2, key: "medallas.bronce" },
        plata: { pts: 3, key: "medallas.plata" },
        oro: { pts: 5, key: "medallas.oro" },
        diamante: { pts: 10, key: "medallas.diamante" },
      };
      //actualizado fin

      let userLocal, unsubConfig, unsubCola, unsubNotas, unsubVotos;
      let configActual = {
        abierta: true,
        bloqueado: false,
        equipoExponiendo: null,
      };
      let cantidadEnColaPrevia = 0;

      //cambiado para que solo profesores autorizados puedan entrar
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          userLocal = user;
          const loginSection = document.getElementById("section-login");
          const profesorSection = document.getElementById("section-profesor");
          try {
            const ref = doc(db, "autorizados", user.email.toLowerCase());
            const snapProfesor = await getDoc(ref);

            if (!snapProfesor.exists()) {
              alert("Profesor no encontrado en autorizados");
              return;
            }

            const dataProfesor = snapProfesor.data();
            const profesorNombre = dataProfesor.nombreCompleto;

            const snap = await getDoc(ref);
            if (snap.exists() && snap.data().activo === true) {
              loginSection.classList.add("hidden");
              profesorSection.classList.remove("hidden");
              window.profesorId = user.uid;
              window.profesorNombre = snap.data().nombreCompleto || user.email;
              // ========== AGREGAR ESTO: Mostrar información del profesor ==========
              const profesorInfo = document.getElementById("profesor-info");
              if (profesorInfo) {
                const nombreProfesor =
                  snap.data().nombreCompleto ||
                  snap.data().nombre ||
                  user.email;
                const emailProfesor = user.email;
                profesorInfo.innerHTML = `
                <div class="flex justify-center items-center gap-2 text-slate-600">
                  <span class="font-bold"> ${nombreProfesor}</span>
                  <span class="text-slate-400">|</span>
                  <span class="text-slate-500"> ${emailProfesor}</span>
                </div>
              `;
              }
              // ========== FIN AGREGADO ==========
              // ========== MODIFICADO: Recuperar última clase seleccionada ==========
              const ultimaClase = localStorage.getItem(
                "ultimaClaseSeleccionada",
              );
              if (ultimaClase) {
                // Esperar a que se carguen las clases y luego seleccionar
                setTimeout(() => {
                  const selector = document.getElementById("filtro-horario");
                  if (selector) {
                    // Verificar si la opción existe
                    let existe = false;
                    for (let i = 0; i < selector.options.length; i++) {
                      if (selector.options[i].value === ultimaClase) {
                        selector.value = ultimaClase;
                        existe = true;
                        break;
                      }
                    }
                    if (existe) {
                      window.actualizarTodoProfesor();
                      cargarGruposDeClase(ultimaClase);
                    }
                  }
                }, 1000);
              }
              // ========== FIN MODIFICADO ==========

              window.actualizarTodoProfesor();
              escucharClasesProfesor();

              // Verificar si hay votación activa
              setTimeout(() => {
                const claseSeleccionada =
                  document.getElementById("filtro-horario").value;
                if (claseSeleccionada) {
                  const claseRef = doc(db, "clases", claseSeleccionada);
                  getDoc(claseRef).then((snapClase) => {
                    if (
                      snapClase.exists() &&
                      snapClase.data().equipoExponiendo
                    ) {
                      const panelEvaluacion = document.getElementById(
                        "sistema-evaluacion-body",
                      );
                      const iconoTriangulo =
                        document.getElementById("triangulo-icon");

                      if (
                        panelEvaluacion &&
                        panelEvaluacion.classList.contains("hidden")
                      ) {
                        panelEvaluacion.classList.remove("hidden");
                        if (iconoTriangulo) {
                          iconoTriangulo.classList.remove("rotate-180");
                        }
                      }
                    }
                  });
                }
              }, 1500);
            } else {
              alert("Este correo no está autorizado como profesor.");
              auth.signOut();
            }
          } catch (e) {
            console.error("Error verificando profesor:", e);
          }
        } else {
          document.getElementById("section-login").classList.remove("hidden");
        }
      });
      // FIN CAMBIO

      window.login = () => signInWithPopup(auth, provider);

      window.verAlumnosPendientes = async () => {
        if (!window.claseActiva) {
          alert("Primero selecciona una clase");
          return;
        }

        const equipoExpo = configActual.equipoExponiendo;

        if (!equipoExpo) {
          return alert(
            "Debe haber un equipo exponiendo para verificar quién falta por votar.",
          );
        }

        try {
          // Obtener el horario de la clase actual
          const claseRef = doc(db, "clases", window.claseActiva);
          const claseSnap = await getDoc(claseRef);

          if (!claseSnap.exists()) {
            alert("La clase no existe");
            return;
          }

          const clase = claseSnap.data();
          const horario = clase.horario;
          const materia = clase.materia || "Sin materia";

          console.log(
            "Verificando pendientes para horario:",
            horario,
            "equipo:",
            equipoExpo,
          );

          // Obtener todos los estudiantes de la clase
          const qEstudiantes = await getDocs(
            collection(db, "clases", window.claseActiva, "estudiantes"),
          );

          // Obtener todos los votos para este horario y equipo expositor
          const qVotos = await getDocs(
            query(
              collection(db, "votaciones"),
              where("horario", "==", horario),
              where("equipoExpo", "==", equipoExpo),
            ),
          );

          // Crear un Set con los UIDs de los alumnos que ya votaron
          const votantesUids = new Set();
          qVotos.forEach((doc) => {
            const data = doc.data();
            votantesUids.add(data.voterUid);
          });

          console.log("Votantes registrados:", votantesUids.size);

          // Recopilar alumnos que no han votado y que NO son del equipo expositor
          const pendientes = [];
          qEstudiantes.forEach((doc) => {
            const data = doc.data();
            const uid = doc.id; // El ID del documento es el UID del alumno
            const nombreCompleto =
              (data.nombre || "") + " " + (data.apellido || "");
            const equipo = data.equipo || "Sin equipo";

            // No considerar al equipo expositor (ellos no votan)
            if (equipo !== equipoExpo && !votantesUids.has(uid)) {
              pendientes.push({
                nombre: nombreCompleto.trim() || "Sin nombre",
                equipo: equipo,
                uid: uid,
              });
            }
          });

          // Ordenar por equipo y luego por nombre
          pendientes.sort((a, b) => {
            if (a.equipo === b.equipo) {
              return a.nombre.localeCompare(b.nombre);
            }
            return a.equipo.localeCompare(b.equipo);
          });

          if (pendientes.length === 0) {
            alert(
              `✅ ¡Excelente! Todos los alumnos (que no pertenecen al equipo "${equipoExpo}") ya votaron.`,
            );
          } else {
            let mensaje = `📋 ALUMNOS QUE FALTAN POR VOTAR\n`;
            mensaje += `Clase: ${materia} (${horario})\n`;
            mensaje += `Equipo expositor: ${equipoExpo}\n`;
            mensaje += `Total pendientes: ${pendientes.length}\n\n`;

            // Agrupar por equipo para mejor visualización
            const porEquipo = {};
            pendientes.forEach((p) => {
              if (!porEquipo[p.equipo]) porEquipo[p.equipo] = [];
              porEquipo[p.equipo].push(p.nombre);
            });

            for (const equipo in porEquipo) {
              mensaje += `\n📌 EQUIPO ${equipo} (${porEquipo[equipo].length} alumnos):\n`;
              porEquipo[equipo].forEach((nombre) => {
                mensaje += `   • ${nombre}\n`;

      function escucharVotosRealtime(h, equipo) {
        console.log("Escuchando votaciones para:", h, equipo);

        if (unsubVotos) unsubVotos();
        unsubVotos = onSnapshot(
          query(
            collection(db, "votaciones"),
            where("horario", "==", h),
            where("equipoExpo", "==", equipo),
          ),
          (snap) => {
            console.log("Votos encontrados:", snap.size);
            console.log(
              "Datos de votos:",
              snap.docs.map((d) => d.data()),
            );

            const contadorVotos = document.getElementById("votos-contados");
            if (contadorVotos) contadorVotos.innerText = snap.size;

            if (snap.empty) {
              document.getElementById("avg-total").innerText = "0.0";
              document.getElementById("desglose-criterios").innerHTML = "";
              return;
            }

            let sumas = {};
            RUBRICA.forEach((c) => (sumas[c.id] = 0));
            snap.forEach((d) => {
              const data = d.data();
              const votos = data.votos || {};

              RUBRICA.forEach((c) => {
                sumas[c.id] += votos[c.id] || 0;
              });
            });

            let html = "",
              totalGral = 0;
            RUBRICA.forEach((c) => {
              const avg = (sumas[c.id] / snap.size).toFixed(1);
              totalGral += parseFloat(avg);
              html += `<div class="flex justify-between"><span>${c.label}</span><span class="text-orange-600">${avg}</span></div>`;
            });

            document.getElementById("avg-total").innerText = (
              totalGral / RUBRICA.length
            ).toFixed(1);
            document.getElementById("desglose-criterios").innerHTML = html;
          },
        );
      }

            nombre: "Anónimo",
            apellido: "",

          };

          csv += `"${eqExpo}","${infoVotante.nombre}","${infoVotante.apellido}","${infoVotante.equipo}",${v.dominio || 0},${v.org || 0},${v.calidad || 0},${v.comunicacion || 0},${v.tiempo || 0},"${(d.sugerencia || "").replace(/"/g, '""')}"\n`;

              dominio: 0,
              org: 0,
              calidad: 0,
              comunicacion: 0,
              tiempo: 0,
            };
          }
          reporteResumen[eqExpo].votos++;
          reporteResumen[eqExpo].dominio += v.dominio || 0;
          reporteResumen[eqExpo].org += v.org || 0;
          reporteResumen[eqExpo].calidad += v.calidad || 0;
          reporteResumen[eqExpo].comunicacion += v.comunicacion || 0;

              parseFloat(pCom) +
              parseFloat(pTie)) /

        }

        const cambiarHorario = confirm("¿Deseas cambiar también el horario?");

        if (cambiarHorario) {

          nuevoHorario = prompt(
            `Ingresa el nuevo horario (${horarios.join(", ")}):`,
            horarioActual,
          );

          if (!nuevoHorario) return;
          nuevoHorario = nuevoHorario.toUpperCase().trim();

          if (!horarios.includes(nuevoHorario)) {
            alert(`Horario no válido. Debe ser uno de: ${horarios.join(", ")}`);
            return;
          }

          // Verificar que no exista otra clase en el nuevo horario
          try {
            const q = query(
              collection(db, "clases"),
              where("profesorID", "==", auth.currentUser.uid),
              where("horario", "==", nuevoHorario),
            );
            const querySnapshot = await getDocs(q);

            // Si existe una clase en ese horario y no es la misma que estamos editando
            if (!querySnapshot.empty) {
              let otraClase = false;
              querySnapshot.forEach((doc) => {
                if (doc.id !== claseId) {
                  otraClase = true;
                }
              });

              if (otraClase) {

            }

            console.error("Error verificando horario:", error);
            alert("Error al verificar disponibilidad del horario");
            return;
          }
        }

        try {
          const claseRef = doc(db, "clases", claseId);
          const updates = { materia: nuevoNombre };

          if (cambiarHorario && nuevoHorario !== horarioActual) {
            updates.horario = nuevoHorario;

      // Función para cargar los grupos de una clase específica
      async function cargarGruposDeClase(claseID) {
        if (!claseID) return;

        try {
          const gruposRef = collection(db, "clases", claseID, "grupos");
          const qGrupos = query(gruposRef, orderBy("nombre", "asc"));

          // También obtener los estudiantes para contar miembros
          const estudiantesRef = collection(
            db,
            "clases",
            claseID,
            "estudiantes",
          );

          // Usar onSnapshot para escuchar cambios en tiempo real
          onSnapshot(qGrupos, async (snapshotGrupos) => {
            // Obtener estudiantes en tiempo real
            onSnapshot(estudiantesRef, (snapshotEstudiantes) => {
              const contenedorGrupos = document.getElementById("lista-grupos");
              if (!contenedorGrupos) return;

              // Crear un mapa de conteo por grupo
              const conteoPorGrupo = {};
              snapshotEstudiantes.forEach((doc) => {
                const estudiante = doc.data();
                const equipo = estudiante.equipo;
                if (equipo) {
                  conteoPorGrupo[equipo] = (conteoPorGrupo[equipo] || 0) + 1;
                }
              });

              if (snapshotGrupos.empty) {
                contenedorGrupos.innerHTML = `
            <div class="text-center text-gray-500 py-4">
              No hay grupos creados en esta clase
            </div>
          `;
                return;
              }

              let html = `
          <div class="space-y-1">
            <h3 class="text-sm font-bold mb-2 text-white">Grupos de la clase:</h3>
        `;

              snapshotGrupos.forEach((doc) => {
                const grupo = doc.data();
                const grupoId = doc.id;
                const miembrosCount = conteoPorGrupo[grupo.nombre] || 0;

                html += `
            <div class="bg-yellow-100 border rounded-lg p-2 flex justify-between items-center">
              <div class="flex-1">
                <span class="text-[14px] text-gray-900 font-bold ml-2">${escapeHtml(grupo.nombre)}</span>
                <span class="text-xs text-gray-500 ml-2">
                  👥 ${miembrosCount} ${miembrosCount === 1 ? "miembro" : "miembros"}
                </span>
              </div>
              <div class="flex gap-2">
                <button 
                  onclick="editarGrupo('${grupoId}', '${escapeHtml(grupo.nombre)}')"
                  class="text-blue-600 hover:text-blue-800 text-sm px-2 py-1 rounded hover:bg-blue-100"
                  title="Editar grupo"
                >
                  ✏️
                </button>
                <button 
                  onclick="eliminarGrupo('${grupoId}', '${escapeHtml(grupo.nombre)}')"
                  class="text-red-600 hover:text-red-800 text-sm px-2 py-1 rounded hover:bg-red-100"
                  title="Eliminar grupo"
                >
                  🗑️
                </button>
              </div>
            </div>
          `;
              });

              html += `</div>`;
              contenedorGrupos.innerHTML = html;
            });
          });
        } catch (error) {
          console.error("Error al cargar grupos:", error);
        }
      }

      // Función para eliminar un grupo
      window.eliminarGrupo = async function (grupoId, nombreGrupo) {
        const confirmar = confirm(
          `¿Estás seguro de eliminar el grupo "${nombreGrupo}"?\n\nLos alumnos asignados a este grupo quedarán sin grupo.`,
        );

        if (!confirmar) return;

        try {
          const claseSeleccionada =
            document.getElementById("filtro-horario").value;
          if (!claseSeleccionada) return;

          // Eliminar el grupo
          await deleteDoc(
            doc(db, "clases", claseSeleccionada, "grupos", grupoId),
          );

          // Opcional: Actualizar los estudiantes que pertenecían a este grupo
          // Esto los dejaría sin grupo asignado
          const estudiantesRef = collection(
            db,
            "clases",
            claseSeleccionada,
            "estudiantes",
          );
          const q = query(estudiantesRef, where("equipo", "==", nombreGrupo));
          const estudiantesSnapshot = await getDocs(q);

          // Actualizar estudiantes para que no tengan grupo
          const updates = [];
          estudiantesSnapshot.forEach((estudianteDoc) => {
            updates.push(
              updateDoc(
                doc(
                  db,
                  "clases",
                  claseSeleccionada,
                  "estudiantes",
                  estudianteDoc.id,
                ),
                {
                  equipo: "SinGrupo",
                },
              ),
            );
          });

          await Promise.all(updates);

          mostrarNotificacion("🗑️", `Grupo "${nombreGrupo}" eliminado`);
        } catch (error) {
          console.error("Error al eliminar grupo:", error);
          alert("Error al eliminar el grupo");
        }
      };

      // Función para editar un grupo
      window.editarGrupo = async function (grupoId, nombreActual) {
        const nuevoNombre = prompt(
          "Ingresa el nuevo nombre del grupo:",
          nombreActual,
        );

        if (!nuevoNombre || nuevoNombre === nombreActual) return;

        if (nuevoNombre.trim() === "") {
          alert("El nombre del grupo no puede estar vacío");
          return;
        }

        try {
          const claseSeleccionada =
            document.getElementById("filtro-horario").value;
          if (!claseSeleccionada) return;

          // Verificar que no exista otro grupo con el mismo nombre
          const gruposRef = collection(
            db,
            "clases",
            claseSeleccionada,
            "grupos",
          );
          const q = query(gruposRef, where("nombre", "==", nuevoNombre));
          const querySnapshot = await getDocs(q);

          if (!querySnapshot.empty && querySnapshot.docs[0].id !== grupoId) {
            alert("Ya existe un grupo con ese nombre");
            return;
          }

          // Actualizar el nombre del grupo
          await updateDoc(
            doc(db, "clases", claseSeleccionada, "grupos", grupoId),
            {
              nombre: nuevoNombre,
            },
          );

          // Actualizar también el campo "equipo" en los estudiantes que pertenecían a este grupo
          const estudiantesRef = collection(
            db,
            "clases",
            claseSeleccionada,
            "estudiantes",
          );
          const qEstudiantes = query(
            estudiantesRef,
            where("equipo", "==", nombreActual),
          );
          const estudiantesSnapshot = await getDocs(qEstudiantes);

          const updates = [];
          estudiantesSnapshot.forEach((estudianteDoc) => {
            updates.push(
              updateDoc(
                doc(
                  db,
                  "clases",
                  claseSeleccionada,
                  "estudiantes",
                  estudianteDoc.id,
                ),
                {
                  equipo: nuevoNombre,
                },
              ),
            );
          });

          await Promise.all(updates);

          mostrarNotificacion("✏️", `Grupo renombrado a "${nuevoNombre}"`);
        } catch (error) {
          console.error("Error al editar grupo:", error);
          alert("Error al editar el grupo");
        }
      };

      // Función auxiliar para escapar HTML y evitar XSS
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Escuchar cambios en la selección de clase para cargar sus grupos
      document.addEventListener("DOMContentLoaded", () => {
        const selectorClase = document.getElementById("filtro-horario");
        if (selectorClase) {
          selectorClase.addEventListener("change", (e) => {
            const claseID = e.target.value;
            if (claseID) {
              localStorage.setItem("ultimaClaseSeleccionada", claseID);
              cargarGruposDeClase(claseID); // Esto ya existe
              window.actualizarTodoProfesor();
              setTimeout(() => restaurarEstadoVotacion(), 500);
            } else {
              localStorage.removeItem("ultimaClaseSeleccionada");
              // Limpiar la lista de grupos cuando no hay clase seleccionada
              const contenedorGrupos = document.getElementById("lista-grupos");
              if (contenedorGrupos) {
                contenedorGrupos.innerHTML = `
            <div class="text-center text-gray-500 py-4">
              Selecciona una clase para ver sus grupos
            </div>
          `;
              }
            }
          });
        }

        // Restaurar estado de votación al cargar la página
        setTimeout(() => restaurarEstadoVotacion(), 1500);
      });

      // Función para mostrar notificaciones (similar a la que usas en index.html)
      function mostrarNotificacion(emoji, mensaje) {
        // Crear el elemento de notificación si no existe
        let notificacion = document.getElementById("notificacion-logro");

        if (!notificacion) {
          // Si no existe, crearlo dinámicamente
          notificacion = document.createElement("div");
          notificacion.id = "notificacion-logro";
          notificacion.className =
            "fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden animate-bounce";
          notificacion.innerHTML = `
            <div class="bg-white border-2 border-blue-500 shadow-2xl rounded-2xl px-6 py-3 flex items-center gap-3">
                <span id="logro-emoji" class="text-3xl"></span>
                <div>
                    <p class="text-[10px] font-black uppercase text-blue-500">Sistema</p>
                    <p id="logro-texto" class="font-bold text-slate-700"></p>
                </div>
            </div>
        `;
          document.body.appendChild(notificacion);
        }

        // Actualizar y mostrar la notificación
        const emojiSpan = document.getElementById("logro-emoji");
        const textoP = document.getElementById("logro-texto");

        if (emojiSpan) emojiSpan.innerText = emoji;
        if (textoP) textoP.innerText = mensaje;

        notificacion.classList.remove("hidden");

        // Ocultar después de 3 segundos
        setTimeout(() => {
          notificacion.classList.add("hidden");
        }, 3000);
      }
      //fin agregado para grupo

      //toggle panel (ejemplo para sección de votaciones, puedes usarlo para otras secciones)
      window.togglePanel = function togglePanel(panelId, iconId) {
        const panel = document.getElementById(panelId);
        const icon = document.getElementById(iconId);

        // Alternar visibilidad del panel
        if (panel.classList.contains("hidden")) {
          panel.classList.remove("hidden");
          icon.classList.remove("rotate-180"); // Vuelve a su posición
        } else {
          panel.classList.add("hidden");
          icon.classList.add("rotate-180"); // Rota 180 grados
        }
      };
      //fin toggle panel
      // Función para sincronizar el selector con el equipo que está exponiendo
      function sincronizarSelectorConEquipoExponiendo(equipoExponiendo) {
        const selExpo = document.getElementById("prof-equipo-expo");
        if (!selExpo) return;

        if (equipoExponiendo) {
          // Buscar la opción en el selector
          let encontrado = false;
          for (let i = 0; i < selExpo.options.length; i++) {
            if (selExpo.options[i].value === equipoExponiendo) {
              selExpo.value = equipoExponiendo;
              encontrado = true;
              break;
            }
          }

          // Si no se encuentra, intentar de nuevo después de un momento
          if (!encontrado) {
            setTimeout(() => {
              for (let i = 0; i < selExpo.options.length; i++) {
                if (selExpo.options[i].value === equipoExponiendo) {
                  selExpo.value = equipoExponiendo;
                  break;
                }
              }
            }, 500);
          }

          // ========== NUEVO: Asegurar que el panel esté abierto ==========
          const panelEvaluacion = document.getElementById(
            "sistema-evaluacion-body",
          );
          const iconoTriangulo = document.getElementById("triangulo-icon");

          if (panelEvaluacion && panelEvaluacion.classList.contains("hidden")) {
            panelEvaluacion.classList.remove("hidden");
            if (iconoTriangulo) {
              iconoTriangulo.classList.remove("rotate-180");
            }
          }
          // ========== FIN NUEVO ==========
        } else {
          selExpo.value = "";
        }
      }

      // Función para restaurar el estado de votación desde localStorage
      function restaurarEstadoVotacion() {
        const claseSeleccionada =
          document.getElementById("filtro-horario").value;
        if (!claseSeleccionada) return;

        const claseRef = doc(db, "clases", claseSeleccionada);
        getDoc(claseRef).then((snap) => {
          if (snap.exists() && snap.data().equipoExponiendo) {
            const equipoExponiendo = snap.data().equipoExponiendo;

            // Abrir el panel de evaluación
            const panelEvaluacion = document.getElementById(
              "sistema-evaluacion-body",
            );
            const iconoTriangulo = document.getElementById("triangulo-icon");

            if (
              panelEvaluacion &&
              panelEvaluacion.classList.contains("hidden")
            ) {
              panelEvaluacion.classList.remove("hidden");
              if (iconoTriangulo) {
                iconoTriangulo.classList.remove("rotate-180");
              }
            }

            setTimeout(() => {
              sincronizarSelectorConEquipoExponiendo(equipoExponiendo);
              if (typeof mostrarNotificacion === "function") {
                mostrarNotificacion(
                  "🔄",
                  `Votación en curso para equipo "${equipoExponiendo}"`,
                );
              }
            }, 500);
          }
        });
      }
    </script>
  </body>
</html>
